[discord]
token_file = "~/.config/omp-discord-bridge/discord-token"
thread_auto_archive_minutes = 1440

[[discord.guilds]]
id = "123456789012345678"
allowed_channels = ["234567890123456789"]
allowed_users = ["345678901234567890"]
cwd = "~/src/project"

[omp]
executable = "omp"
session_dir = "~/.local/state/omp-discord-bridge/omp-sessions"
allowed_root = "~/src"
# Omit model to use OMP's configured default, or set an exact provider/model ID.
# model = "openai-codex/gpt-5.6-sol"
# thinking_level = "medium"
# Optional model for minute-based title review; defaults to model above / OMP default.
# title_model = "openai-codex/gpt-5.6-sol"

# Optional TODO-triggered note retrieval; omit this section or use [] to disable.
# Sends full TODO state and every candidate note's full title/content to TypeSafe.
# [omp.note_retrieval]
# notebook_ids = ["notebook:example"]
# base_url = "http://127.0.0.1:5055" # Default Open Notebook API URL, not UI URL.
# typesafe_key_file = "~/.config/omp-discord-bridge/typesafe-key" # chmod 600
# password_file = "~/.config/omp-discord-bridge/notebook-password" # Optional; chmod 600

[runtime]
database_path = "~/.local/state/omp-discord-bridge/bridge.sqlite"
max_concurrency = 2
discord_message_limit = 1900
max_attachment_bytes = 25000000
max_attachments = 10
max_response_bytes = 1048576
discord_history_max_days = 30
discord_history_max_messages = 5000
discord_history_max_bytes = 131072
discord_history_timeout_seconds = 30
turn_timeout_seconds = 3600
