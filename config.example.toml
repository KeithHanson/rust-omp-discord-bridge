# Optional Discord adapter. Omit this whole section (and its guilds) to run a
# Matrix-only bridge; with neither Discord nor Matrix configured the bridge
# boots idle with a startup warning.
[discord]
token_file = "~/.config/omp-client-bridge/discord-token"
thread_auto_archive_minutes = 1440

[[discord.guilds]]
id = "123456789012345678"
allowed_channels = ["234567890123456789"]
allowed_users = ["345678901234567890"]
cwd = "~/src/project"

# Optional Matrix adapter. Rooms and users are default-deny.
# [matrix]
# homeserver_url = "https://matrix.example.org"
# access_token_file = "~/.config/omp-client-bridge/matrix-token"
# session_store_path = "~/.local/state/omp-client-bridge/matrix-sync-token"
#
# [[matrix.rooms]]
# id = "!room:matrix.example.org"
# allowed_users = ["@operator:matrix.example.org"]
# require_mention = true
# cwd = "~/src/project"

[omp]
executable = "omp"
session_dir = "~/.local/state/omp-client-bridge/omp-sessions"
allowed_root = "~/src"
# Omit model to use OMP's configured default, or set an exact provider/model ID.
# model = "openai-codex/gpt-5.6-sol"
# thinking_level = "medium"
# Optional model for minute-based title review; defaults to model above / OMP default.
# title_model = "openai-codex/gpt-5.6-sol"

[runtime]
database_path = "~/.local/state/omp-client-bridge/bridge.sqlite"
max_concurrency = 2
discord_message_limit = 1900
max_attachment_bytes = 25000000
max_attachments = 10
max_response_bytes = 1048576
discord_history_max_days = 30
discord_history_max_messages = 5000
discord_history_max_bytes = 131072
discord_history_timeout_seconds = 30
turn_timeout_seconds = 3600

# Optional integrated Threadwatch reporting. Preserve data_dir when migrating from
# the former standalone collector so pending batches/checkpoints remain intact.
# [threadwatch]
# server_url = "http://192.168.192.183:8787"
# ingest_token_file = "~/.config/omp-client-bridge/threadwatch-ingest-token"
# bot_id = "hephaestus"
# bot_name = "Hephaestus"
# data_dir = "~/.local/state/threadwatch-collector"
# collect_interval_ms = 2000
# heartbeat_interval_ms = 10000
