[Service]
# Synchronous fresh fetch on every start, including Restart=on-failure.
# '+' runs only this systemctl invocation as root, not the bridge or Agent.
# Do not clear existing ExecStartPre commands or replace ExecStart.
ExecStartPre=+/usr/bin/systemctl start omp-discord-bridge-infisical.service
# Allow the Agent's bounded fetch and shutdown to finish before timing out.
TimeoutStartSec=150
