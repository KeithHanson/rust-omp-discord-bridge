[package]
name = "omp-client-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Discord and Matrix gateway for persistent OMP conversations"
license = "MIT"
default-run = "omp-client-bridge"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
base64 = "0.22"
dotenvy = "0.15"
futures-util = "0.3"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
serenity = { version = "0.12.5", default-features = false, features = [
  "builder",
  "client",
  "gateway",
  "http",
  "model",
  "rustls_backend",
] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
thiserror = "2.0"
notify = "8"
tokio = { version = "1.54", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
