[package]
name = "omp-discord-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Discord gateway for persistent per-thread OMP sessions"
license = "MIT"
default-run = "omp-discord-bridge"

[features]
local-voice = [
  "dep:earshot",
  "dep:ogg",
  "dep:opus2",
  "dep:songbird",
  "dep:tokio-tungstenite",
  "reqwest/multipart",
]

[[bin]]
name = "voice-watch"
path = "src/bin/voice-watch.rs"
required-features = ["local-voice"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
dotenvy = "0.15"
earshot = { version = "=1.2.2", optional = true }
futures-util = "0.3"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"] }
songbird = { version = "=0.6.0", optional = true, features = ["receive"] }
serde_json = "1.0"
ogg = { version = "0.9", optional = true }
opus2 = { version = "0.4", optional = true }
sha2 = "0.10"
tempfile = "3.23"
serenity = { version = "0.12.5", default-features = false, features = [
  "builder",
  "client",
  "gateway",
  "http",
  "model",
  "rustls_backend",
] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
thiserror = "2.0"
tokio = { version = "1.54", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.30", optional = true }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
songbird = { git = "https://github.com/Smotto/DiscordMusicBot", rev = "75579347" }

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
